name: Deploy Onemail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      # ── Provision resources (idempotent — safe to run every deploy) ──

      - name: Create D1 database (if not exists)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 create onemail-db || true

      - name: Create KV namespaces (if not exists)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv namespace create SESSIONS       || true
          npx wrangler kv namespace create SESSIONS --preview || true
          npx wrangler kv namespace create OAUTH_STATE    || true
          npx wrangler kv namespace create OAUTH_STATE --preview || true

      - name: Create R2 bucket (if not exists)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create onemail-attachments || true

      # ── Patch wrangler.toml with real IDs ────────────────────────────

      - name: Patch wrangler.toml with real resource IDs
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Fetch D1 database ID
          DB_ID=$(npx wrangler d1 list --json | \
            node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
              const list=JSON.parse(d); \
              const db=list.find(x=>x.name==='onemail-db'); \
              process.stdout.write(db?db.uuid:'')") || true

          # Fetch KV namespace IDs
          KV_JSON=$(npx wrangler kv namespace list --json) || true
          KV_SESSIONS=$(echo "$KV_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
            const list=JSON.parse(d); \
            const ns=list.find(x=>x.title==='onemail-worker-SESSIONS'); \
            process.stdout.write(ns?ns.id:'')") || true
          KV_SESSIONS_PREV=$(echo "$KV_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
            const list=JSON.parse(d); \
            const ns=list.find(x=>x.title==='onemail-worker-SESSIONS_preview'); \
            process.stdout.write(ns?ns.id:'')") || true
          KV_STATE=$(echo "$KV_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
            const list=JSON.parse(d); \
            const ns=list.find(x=>x.title==='onemail-worker-OAUTH_STATE'); \
            process.stdout.write(ns?ns.id:'')") || true
          KV_STATE_PREV=$(echo "$KV_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
            const list=JSON.parse(d); \
            const ns=list.find(x=>x.title==='onemail-worker-OAUTH_STATE_preview'); \
            process.stdout.write(ns?ns.id:'')") || true

          # Patch wrangler.toml
          [ -n "$DB_ID" ]           && sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$DB_ID/g" wrangler.toml
          [ -n "$KV_SESSIONS" ]     && sed -i "s/REPLACE_WITH_YOUR_KV_SESSIONS_ID/$KV_SESSIONS/g" wrangler.toml
          [ -n "$KV_SESSIONS_PREV" ] && sed -i "s/REPLACE_WITH_YOUR_KV_SESSIONS_PREVIEW_ID/$KV_SESSIONS_PREV/g" wrangler.toml
          [ -n "$KV_STATE" ]        && sed -i "s/REPLACE_WITH_YOUR_KV_OAUTH_STATE_ID/$KV_STATE/g" wrangler.toml
          [ -n "$KV_STATE_PREV" ]   && sed -i "s/REPLACE_WITH_YOUR_KV_OAUTH_STATE_PREVIEW_ID/$KV_STATE_PREV/g" wrangler.toml

          echo "=== Patched wrangler.toml ==="
          grep -E "database_id|^id " wrangler.toml

      # ── Migrate → Deploy Worker → Secrets ───────────────────────────

      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply onemail-db

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Upload Worker secrets
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET:         ${{ secrets.SESSION_SECRET }}
          TOKEN_ENCRYPTION_KEY:   ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          APP_URL:                ${{ secrets.APP_URL }}
          WORKER_URL:             ${{ secrets.WORKER_URL }}
        run: |
          for SECRET in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SESSION_SECRET TOKEN_ENCRYPTION_KEY APP_URL WORKER_URL; do
            VAL="${!SECRET}"
            if [ -n "$VAL" ]; then
              echo "$VAL" | npx wrangler secret put "$SECRET"
            fi
          done

      # ── Build and deploy Pages ───────────────────────────────────────

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ../web/dist \
            --project-name onemail \
            --branch main
