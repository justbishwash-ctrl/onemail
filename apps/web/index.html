<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onemail — a cleaner Gmail client" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Prevent search engine indexing of personal email client -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- CSP applied at edge via _headers; this is a belt-and-suspenders fallback -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.onemail.gdn.com.np;"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Onemail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
