name = "onemail-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ────────────────────────────────────────────
[[d1_databases]]
binding     = "DB"
database_name = "onemail-db"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../../migrations"

# ── KV Namespaces ──────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "REPLACE_WITH_YOUR_KV_SESSIONS_ID"
preview_id = "REPLACE_WITH_YOUR_KV_SESSIONS_PREVIEW_ID"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id      = "REPLACE_WITH_YOUR_KV_OAUTH_STATE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_OAUTH_STATE_PREVIEW_ID"

# ── R2 Bucket (attachment proxy cache) ────────────────────
[[r2_buckets]]
binding     = "ATTACHMENTS"
bucket_name = "onemail-attachments"

# ── Environment variables (non-secret) ────────────────────
[vars]
ENVIRONMENT = "development"

# ── Routes ────────────────────────────────────────────────
# Set these after deploying Pages to point Workers at your domain
# [[routes]]
# pattern = "api.onemail.yourdomain.com/*"
# zone_name = "yourdomain.com"

# ── Production environment override ───────────────────────
[env.production]
name = "onemail-worker-production"
vars = { ENVIRONMENT = "production" }
