name = "onemail-cf"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ────────────────────────────────────────────
[[d1_databases]]
binding     = "DB"
database_name = "onemail-db"
database_id   = "a834c1d3-4785-4e6c-b353-4ac3ac1570fe"
migrations_dir = "../../migrations"

# ── KV Namespaces ──────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "13bf2ffc6e424f74b8e51a0181637739"
preview_id = "7bfc8d3138ff4599a056fbf40c29fd97"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id      = "1caa643378aa42c2b7f4a3a87bfa5849"
preview_id = "523396f10c7848b588cdede16763cc60"

# ── R2 Bucket (attachment proxy cache) ────────────────────
[[r2_buckets]]
binding     = "ATTACHMENTS"
bucket_name = "onemail-attachments"

# ── Environment variables (non-secret) ────────────────────
[vars]
ENVIRONMENT = "development"

# ── Routes ────────────────────────────────────────────────
# Set these after deploying Pages to point Workers at your domain
# [[routes]]
# pattern = "api.onemail.yourdomain.com/*"
# zone_name = "yourdomain.com"

# ── Production environment override ───────────────────────
[env.production]
name = "onemail-cf"
vars = { ENVIRONMENT = "production" }
